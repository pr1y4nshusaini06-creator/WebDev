<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <img src="images__5_-removebg-preview.png" alt="" />
    <div id="Form">
      <h1>Hello Again!</h1>
      <h2>Welcome Back! we missed you!</h2>
      <form>
        <div id="inputs">
          <label for="email">Email:</label>
          <input
            id="email"
            type="email"
            placeholder="emailid@site.com"
            title="Email"
          />
          <label for="password">Password:</label>
          <input
            id="password"
            type="password"
            placeholder="Password"
            title="Password"
          />
        </div>
        <button id="Forgot" type="button"><span>Forgot Password</span></button>
        <button id="Login" type="submit">Login</button>
        <div class="NotMem">
          <p>Not a member?</p>
          <p id="Register" href="#">Register Now</p>
        </div>
      </form>
    </div>
  </body>
</html>
